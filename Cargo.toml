[workspace]
members  = ["crates/argus-redact-core", "crates/argus-redact-py", "crates/argus-redact-wasm"]
resolver = "2"

[workspace.package]
version      = "0.8.19"
edition      = "2024"
rust-version = "1.85"
license      = "Apache-2.0"
repository   = "https://github.com/wan9yu/argus-redact"

[workspace.dependencies]
fancy-regex           = "0.19"
pyo3                  = { version = "0.29", features = ["extension-module"] }
serde                 = { version = "1", features = ["derive"] }
serde_json            = "1"
ron                   = "0.12"
unicode-normalization = "0.1"
sha2                  = "0.11"
sha3                  = "0.12"
hmac                  = "0.13"
base64                = "0.23"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = true
