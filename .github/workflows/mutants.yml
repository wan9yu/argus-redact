name: Mutation tests (core)

# `make mutants-core` runs cargo-mutants over the security-critical Rust core
# (crypto / checksum / restore / seed / pseudonym) and the Layer-1 detection core.
# It is far too slow to gate every push, so it runs on a weekly schedule — plus
# manual dispatch for use before a release. NOT continue-on-error: a surviving
# mutant in these modules is a real hole in the test suite and must show up red.
on:
  schedule:
    - cron: "17 4 * * 1"   # Mondays, 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutants-core:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05-03

      - name: Cache Rust
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-mutants-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install cargo-mutants
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-mutants

      - name: Run mutation tests over the core
        run: make mutants-core

      - name: Upload cargo-mutants report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-core-report
          path: crates/argus-redact-core/mutants.out/
          if-no-files-found: ignore
