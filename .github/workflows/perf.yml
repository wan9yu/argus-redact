name: Performance Budget

# Runs on PRs AND on direct pushes to main. This repo is trunk-based (changes land
# on main directly), so a pull_request-only trigger would leave the gate never
# running on the code it guards.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0   # need full history for merge-base diff against origin/main

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05-03

      - name: Install
        run: |
          pip install maturin
          pip install -e ".[dev]"

      - name: Detect baseline-touch (gate exemption)
        id: gate
        env:
          # On a push event, HEAD *is* origin/main, so a three-dot diff against
          # origin/main is always empty and the exemption could never fire. Compare
          # against the pushed range instead. github.event.before is the all-zeros
          # SHA for the first push of a branch — fall back to HEAD~ then to "no
          # exemption" so a fresh branch can't crash the step.
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -uo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            git fetch origin main
            RANGE_ARGS=(origin/main...HEAD)
          else
            if [ -n "${EVENT_BEFORE:-}" ] && [ "${EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${EVENT_BEFORE}^{commit}" 2>/dev/null; then
              RANGE_ARGS=("${EVENT_BEFORE}" "${EVENT_SHA}")
            elif git rev-parse -q --verify HEAD~1 >/dev/null; then
              RANGE_ARGS=(HEAD~1 HEAD)
            else
              RANGE_ARGS=()
            fi
          fi
          if [ ${#RANGE_ARGS[@]} -gt 0 ] \
             && git diff --name-only "${RANGE_ARGS[@]}" | grep -q "^tests/benchmark/baseline\.json$"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Baseline file modified in this change — skipping perf gate."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Measure
        if: steps.gate.outputs.skip != 'true'
        run: |
          PYTHONPATH=src python tests/benchmark/run_perf_budget.py \
            --output current.json \
            --platform "ubuntu-latest" \
            --commit "${{ github.event.pull_request.head.sha || github.sha }}"
          cat current.json

      - name: Compare against baseline
        if: steps.gate.outputs.skip != 'true'
        run: |
          python tests/benchmark/compare_baseline.py current.json tests/benchmark/baseline.json
