name: Release

on:
  push:
    tags: ["v*"]

# Default permissions: minimum needed by most jobs.
# id-token: write is granted only at the publish step (release job) for PyPI
# trusted publishing — not workflow-wide. Pinning every third-party action to
# a 40-char commit SHA defends against upstream tag-rewrite supply-chain attacks.
permissions:
  contents: read

jobs:
  # Cheap release-shape checks, first and blocking: the pushed tag must name the
  # version pyproject declares, and the CHANGELOG's top entry must match it too.
  # Both are release-time invariants (they are deliberately NOT enforced on every
  # main push, where a CHANGELOG-ahead-of-pyproject state is legitimate).
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches pyproject version
        env:
          TAG: ${{ github.ref_name }}
        run: make tag-version-check TAG="$TAG"
      - name: CHANGELOG matches pyproject version
        run: make changelog-version-check

  # The FULL test suite, re-run on the release SHA. `make release` pushes main and
  # the tag in one command, so the branch-push Tests run and this tag-push Release
  # run dispatch concurrently — a workflow_run trigger cannot express "the Tests
  # run for this exact SHA". Calling test.yml as a reusable workflow makes the
  # dependency explicit at the cost of duplicated compute.
  test:
    needs: preflight
    uses: ./.github/workflows/test.yml
    secrets: inherit

  build-wheels:
    needs: test
    strategy:
      # Each leg produces an independent artifact, so one leg's failure says
      # nothing about the others — and these legs are exactly where transient
      # infrastructure bites (the QEMU setup pulls from Docker Hub, the
      # manylinux/musllinux legs pull their images). Under the default,
      # a single registry timeout cancelled six healthy builds and forced a
      # full re-run; without it the re-run is one leg. Matches the test matrix.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
            container: quay.io/pypa/manylinux2014_x86_64@sha256:908ee2cb6c1c795224f5536d39abca18cb780e5a0eeffad0af64021b461136f0
          - os: ubuntu-latest
            target: aarch64
            manylinux: auto
          - os: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
            container: quay.io/pypa/musllinux_1_2_x86_64@sha256:64919b0fd451133856a4b266317da0363a7023948f8517156c42bc437751198e
          - os: ubuntu-latest
            target: aarch64
            manylinux: musllinux_1_2
          - os: macos-14
            target: aarch64
            manylinux: auto
          - os: macos-14
            target: x86_64
            manylinux: auto
          - os: windows-latest
            target: x64
            manylinux: auto
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up QEMU (for cross-compilation)
        if: matrix.target == 'aarch64' && runner.os == 'Linux'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      # manylinux/musllinux container references pinned to digest (not :latest).
      # Background: the :latest tag resolution endpoint at quay.io has been the
      # source of release-blocking 5xx errors. Digest references skip that
      # endpoint. Bump these when updating Python / Rust toolchain or manylinux
      # baseline.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --out dist -i python3.10 python3.11 python3.12 python3.13
          manylinux: ${{ matrix.manylinux }}
          container: ${{ matrix.container }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist/*.whl

  # Also build pure Python sdist (fallback for unsupported platforms)
  build-sdist:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          pip install build
          python -m build --sdist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz

  release:
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub Release create
      id-token: write   # PyPI trusted publishing (scoped to this job only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1 @ 2026-05-03
        with:
          # skip-existing: re-runs are idempotent (don't fail if a version's files
          # are already on PyPI). attestations disabled: the sigstore attestation
          # upload phase failed post-upload in v0.7.0, marking the step red even
          # though all files published — and cascade-skipping GitHub Release +
          # crates.io. Files publish fine; we drop the flaky attestation step.
          skip-existing: true
          attestations: false

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes

  # The HF Space deploy lives in its own workflow (deploy-demo.yml) so it can also run
  # on demo/wasm pushes and manual dispatch — decoupled from releases. We invoke it
  # here after a successful publish so a release refreshes the Space too. `needs:
  # release` gates it on PyPI + GitHub Release success; it stays independent of
  # publish-crate (a Space update must never gate crates.io). `secrets: inherit`
  # passes HF_TOKEN through to the reusable workflow.
  deploy-demo:
    needs: release
    uses: ./.github/workflows/deploy-demo.yml
    secrets: inherit

  # crates.io publish runs LAST and only after PyPI + GitHub Release succeed.
  # crates.io versions are irreversible (a yanked version can't be reused), so we
  # publish the most-irreversible registry last, keeping PyPI and crates.io in sync.
  # Requires the CARGO_REGISTRY_TOKEN repo secret (crates.io API token).
  publish-crate:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05-03
      - name: Publish argus-redact-core to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p argus-redact-core --dry-run
          cargo publish -p argus-redact-core
