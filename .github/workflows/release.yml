name: Release

on:
  push:
    tags: ["v*"]

# Default permissions: minimum needed by most jobs.
# id-token: write is granted only at the publish step (release job) for PyPI
# trusted publishing — not workflow-wide. Pinning every third-party action to
# a 40-char commit SHA defends against upstream tag-rewrite supply-chain attacks.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05-03

      - name: Install dependencies
        run: |
          pip install maturin
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -p no:recording -q -m "not ner and not semantic and not slow"

  build-wheels:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: auto
            container: quay.io/pypa/manylinux2014_x86_64@sha256:908ee2cb6c1c795224f5536d39abca18cb780e5a0eeffad0af64021b461136f0
          - os: ubuntu-latest
            target: aarch64
            manylinux: auto
          - os: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
            container: quay.io/pypa/musllinux_1_2_x86_64@sha256:64919b0fd451133856a4b266317da0363a7023948f8517156c42bc437751198e
          - os: ubuntu-latest
            target: aarch64
            manylinux: musllinux_1_2
          - os: macos-14
            target: aarch64
            manylinux: auto
          - os: macos-14
            target: x86_64
            manylinux: auto
          - os: windows-latest
            target: x64
            manylinux: auto
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up QEMU (for cross-compilation)
        if: matrix.target == 'aarch64' && runner.os == 'Linux'
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
        with:
          platforms: arm64

      # manylinux/musllinux container references pinned to digest (not :latest).
      # Background: the :latest tag resolution endpoint at quay.io has been the
      # source of release-blocking 5xx errors. Digest references skip that
      # endpoint. Bump these when updating Python / Rust toolchain or manylinux
      # baseline.
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --out dist -i python3.10 python3.11 python3.12 python3.13
          manylinux: ${{ matrix.manylinux }}
          container: ${{ matrix.container }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist/*.whl

  # Also build pure Python sdist (fallback for unsupported platforms)
  build-sdist:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - run: |
          pip install build
          python -m build --sdist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: dist/*.tar.gz

  release:
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub Release create
      id-token: write   # PyPI trusted publishing (scoped to this job only)
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1 @ 2026-05-03
        with:
          # skip-existing: re-runs are idempotent (don't fail if a version's files
          # are already on PyPI). attestations disabled: the sigstore attestation
          # upload phase failed post-upload in v0.7.0, marking the step red even
          # though all files published — and cascade-skipping GitHub Release +
          # crates.io. Files publish fine; we drop the flaky attestation step.
          skip-existing: true
          attestations: false

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes

  # Build the --target web wasm into demo/pkg-web (gitignored), then upload the
  # static demo/ to the HF Space. Separate from `release` because that job has no
  # Rust/wasm toolchain. Runs after the GitHub Release + PyPI publish succeed; it
  # is independent of publish-crate (a Space update must never gate crates.io).
  deploy-demo:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Rust (wasm target)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05-03
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: command -v wasm-pack >/dev/null || cargo install wasm-pack --locked

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Build demo web artifact + size-optimize
        shell: bash
        run: |
          set -euo pipefail
          # --out-dir is resolved relative to the CRATE dir, so an absolute path is
          # required to land the artifact at repo-root/demo/pkg-web (where upload_folder
          # reads it) rather than crates/argus-redact-wasm/demo/pkg-web.
          wasm-pack build crates/argus-redact-wasm --release --target web --out-dir "$GITHUB_WORKSPACE/demo/pkg-web"
          wasm-opt -Oz \
            --enable-bulk-memory \
            --enable-nontrapping-float-to-int \
            --enable-sign-ext \
            --enable-mutable-globals \
            --enable-reference-types \
            --enable-multivalue \
            demo/pkg-web/argus_redact_wasm_bg.wasm -o demo/pkg-web/argus_redact_wasm_bg.wasm
          echo "demo wasm gzipped: $(gzip -c demo/pkg-web/argus_redact_wasm_bg.wasm | wc -c) bytes"

      - name: Deploy HF Space (static)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub
          python -c "
          from huggingface_hub import HfApi
          HfApi().upload_folder(folder_path='demo', repo_id='wan9yu/argus-redact', repo_type='space')
          print('HF static Space deployed')
          "

  # crates.io publish runs LAST and only after PyPI + GitHub Release succeed.
  # crates.io versions are irreversible (a yanked version can't be reused), so we
  # publish the most-irreversible registry last, keeping PyPI and crates.io in sync.
  # Requires the CARGO_REGISTRY_TOKEN repo secret (crates.io API token).
  publish-crate:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05-03
      - name: Publish argus-redact-core to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p argus-redact-core --dry-run
          cargo publish -p argus-redact-core
