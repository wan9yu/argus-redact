name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Callable as a reusable workflow so release.yml can gate publishing on this
  # ENTIRE suite (lint + Rust core tests + the Windows leg + version sync +
  # integration + presidio + sdist-install + wasm + demo-e2e) rather than on a
  # release-local subset. Additive: the push/pull_request triggers above are
  # unaffected. Callers pass `secrets: inherit` so the Codecov uploads keep working.
  workflow_call:

permissions:
  contents: read

# Supersede an in-flight run when a newer commit lands on the same ref.
#
# Safety against cancelling a RELEASE's test run: in a `workflow_call` invocation
# the `github` context belongs to the CALLER, so a release (tag push) evaluates
# this group with `github.ref == refs/tags/vX.Y.Z`, while a branch push evaluates
# it with `github.ref == refs/heads/main` and a pull_request with
# `refs/pull/<n>/merge`. Those three ref namespaces are disjoint, so no branch or
# PR run can ever share a group with — and therefore cancel — a tag-triggered
# release run, regardless of whether `github.workflow` resolves to the caller's
# name or this file's. `make release` pushes main and the tag together, and the
# two resulting runs land in different groups by construction.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ruff (pinned for a deterministic lint gate)
        run: pip install ruff==0.15.9
      - name: Ruff lint + format check (mirrors `make lint`)
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Windows: smoke-test path/encoding contract on a single Python
          # (full version coverage already runs on Linux).
          - os: windows-latest
            python-version: "3.12"

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Guard against member-level Cargo.lock
        shell: bash
        run: |
          if ls crates/*/Cargo.lock 2>/dev/null; then
            echo "::error::member-level Cargo.lock shadows the workspace lock — remove it"
            exit 1
          fi

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05-03

      - name: Cache Rust
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Rust core unit tests
        run: cargo test -p argus-redact-core

      - name: Install dependencies
        run: |
          pip install maturin
          pip install -e ".[dev]"

      - name: Version sync check
        run: make sync-docs-version-check

      - name: Run tests with coverage
        run: pytest --cov=argus_redact --cov-report=xml --cov-report=term -p no:recording -m "not ner and not semantic and not slow"

      - name: Upload Python coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.xml
          flags: python
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # The server (Starlette) and MCP integration suites are `skipif(not HAS_STARLETTE)`
  # / `pytest.mark.slow` so the base `test` job's `.[dev]` install never has to carry
  # starlette/mcp — which also means those suites never actually run in `test`; they
  # silently skip and the job still reports green. This job installs the `serve` and
  # `mcp` extras and runs them for real (the `not slow` deselect is intentionally
  # dropped here — that's the whole point).
  #
  # This is a THIRD workflow leg alongside `lint`/`test`: its green must be checked
  # independently at release time, since a green `test` job does not imply this one
  # ran, let alone passed.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05-03

      - name: Cache Rust
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install dependencies (dev + serve + mcp)
        run: |
          pip install maturin
          pip install -e ".[dev,serve,mcp]"

      - name: Run server + MCP integration suites
        # ARGUS_REQUIRE_INTEGRATION_EXTRAS is the meta-guard in
        # tests/integration/conftest.py: it fails the job loudly if starlette/mcp
        # didn't actually install, instead of letting every gated test skip to a
        # false green.
        env:
          ARGUS_REQUIRE_INTEGRATION_EXTRAS: starlette,mcp
        run: pytest tests/integration -m "not ner and not semantic" -p no:recording

  # Presidio bridge suite, isolated from the `integration` job above so spaCy's
  # model pull (and any presidio-analyzer flakiness) can't block the server/MCP
  # signal. Same false-green risk and same meta-guard mechanism, scoped to presidio.
  integration-presidio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05-03

      - name: Cache Rust
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install dependencies (dev + presidio)
        run: |
          pip install maturin
          pip install -e ".[dev,presidio]"

      - name: Run Presidio integration suite
        env:
          ARGUS_REQUIRE_INTEGRATION_EXTRAS: presidio_analyzer
        run: |
          pytest tests/integration/test_presidio.py tests/integration/test_presidio_pipeline_guarantees.py \
            -m "not ner and not semantic" -p no:recording

  # Build the sdist and install it in a fresh venv. The binding crate depends on
  # the core crate via a path dep (../argus-redact-core); wheel-only CI would not
  # catch a path-dependency that fails to vendor into the sdist. This job compiles
  # the Rust from source on install, then smoke-tests redact().
  sdist-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05-03

      - name: Build sdist
        run: pip install maturin && maturin sdist --out dist

      - name: Validate sdist metadata (twine check)
        # Catches PyPI-upload-blocking metadata issues that `pip install` does not,
        # e.g. a declared `License-File` missing from the distribution (v0.7.0 hit
        # this — the LICENSE file wasn't bundled, PyPI 400'd on upload).
        run: pip install twine && twine check dist/*

      - name: Install from sdist (fresh venv) + smoke test
        shell: bash
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install dist/*.tar.gz
          /tmp/sdist-venv/bin/python -c "from argus_redact import redact; out, key = redact('Alice 13800138000', mode='fast', lang='zh'); assert '13800138000' not in out, out; print('sdist OK')"

  # Build the wasm package (argus-redact-wasm), run its node test suite (smoke +
  # golden-parity), size-optimize the artifact with wasm-opt, and gate the
  # optimized gzipped .wasm against tests/benchmark/wasm_bundle_budget.json.
  # ARTIFACT ONLY — this job does NOT publish to npm. The crate sets
  # `wasm-opt = false` (so wasm-pack does not auto-fetch binaryen), so wasm-opt is
  # run here explicitly. A separate job so a wasm failure is attributed cleanly.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust (wasm target)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05-03
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: rust-wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install wasm-pack
        # Idempotent: the Rust cache (keyed on Cargo.lock) restores ~/.cargo/bin,
        # so a cache hit already has wasm-pack and `cargo install` would abort with
        # "binary already exists". Skip the install when it's already on PATH.
        run: command -v wasm-pack >/dev/null || cargo install wasm-pack --locked

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Build wasm package (bundler target)
        run: wasm-pack build crates/argus-redact-wasm --target bundler --out-dir pkg

      - name: Run wasm node tests (smoke + golden-parity)
        run: wasm-pack test --node crates/argus-redact-wasm

      - name: Size-optimize and gate the bundle
        shell: bash
        run: |
          set -euo pipefail
          WASM=crates/argus-redact-wasm/pkg/argus_redact_wasm_bg.wasm
          # Modern LLVM emits bulk-memory / ref-types ops; enable the feature set so
          # wasm-opt validates the wasm-bindgen output (the crate disables wasm-pack's
          # auto wasm-opt, so we run it here).
          wasm-opt -Oz \
            --enable-bulk-memory \
            --enable-nontrapping-float-to-int \
            --enable-sign-ext \
            --enable-mutable-globals \
            --enable-reference-types \
            --enable-multivalue \
            "$WASM" -o /tmp/argus_opt.wasm
          GZ=$(gzip -c /tmp/argus_opt.wasm | wc -c)
          CEILING=$(python3 -c "import json;print(json.load(open('tests/benchmark/wasm_bundle_budget.json'))['budget']['ceiling_bytes'])")
          echo "optimized gzipped .wasm: ${GZ} bytes (budget ceiling: ${CEILING} bytes)"
          if [ "$GZ" -gt "$CEILING" ]; then
            echo "::error::wasm bundle ${GZ} B exceeds budget ${CEILING} B (see tests/benchmark/wasm_bundle_budget.json)"
            exit 1
          fi
          echo "wasm bundle within budget."

  # Demo end-to-end: build the --target web artifact the HF Space ships (same build
  # the release `deploy-demo` job runs) and drive it in headless Chromium via the
  # Playwright suite (golden P-83811 + restore + streaming straddle + hero/playground
  # UI). Gates main/PR so a broken demo or web-build-path regression is caught here,
  # not silently shipped to the Space on the next tag. Independent of the release path.
  demo-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust (wasm target)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05-03
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: rust-wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install wasm-pack
        run: command -v wasm-pack >/dev/null || cargo install wasm-pack --locked

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Build demo web artifact (mirrors the deploy build)
        shell: bash
        run: |
          set -euo pipefail
          # --out-dir is crate-relative, so an absolute path lands it at repo-root/demo/pkg-web.
          wasm-pack build crates/argus-redact-wasm --release --target web --out-dir "$GITHUB_WORKSPACE/demo/pkg-web"
          wasm-opt -Oz \
            --enable-bulk-memory \
            --enable-nontrapping-float-to-int \
            --enable-sign-ext \
            --enable-mutable-globals \
            --enable-reference-types \
            --enable-multivalue \
            demo/pkg-web/argus_redact_wasm_bg.wasm -o demo/pkg-web/argus_redact_wasm_bg.wasm

      - name: Run demo browser tests (Playwright)
        working-directory: tests/demo
        run: |
          npm install
          npx playwright install --with-deps chromium
          npx playwright test

  # Rust coverage for the pure core crate (argus-redact-core), uploaded to Codecov
  # under the `rust` flag. Python (`pytest --cov`) only measures the Python surface;
  # as Layer-1 logic moves into the core (validators, normalize, lang_detect, …),
  # this keeps the load-bearing Rust visible in the coverage metric. The binding
  # crate (argus-redact-py) needs Python linking and is exercised via pytest, so it
  # is intentionally out of scope here — `-p argus-redact-core` covers the pure core.
  rust-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05-03
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2.86.4
        with:
          tool: cargo-llvm-cov

      - name: Generate Rust coverage (codecov format)
        run: cargo llvm-cov -p argus-redact-core --codecov --output-path rust-cov.json

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: rust-cov.json
          flags: rust
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
