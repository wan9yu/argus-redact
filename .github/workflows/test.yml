name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Windows: smoke-test path/encoding contract on a single Python
          # (full version coverage already runs on Linux).
          - os: windows-latest
            python-version: "3.12"

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Guard against member-level Cargo.lock
        shell: bash
        run: |
          if ls crates/*/Cargo.lock 2>/dev/null; then
            echo "::error::member-level Cargo.lock shadows the workspace lock — remove it"
            exit 1
          fi

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05-03

      - name: Cache Rust
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Rust core unit tests
        run: cargo test -p argus-redact-core

      - name: Install dependencies
        run: |
          pip install maturin
          pip install -e ".[dev]"

      - name: Version sync check
        run: make sync-docs-version-check

      - name: Run tests with coverage
        run: pytest --cov=argus_redact --cov-report=xml --cov-report=term -p no:recording -m "not ner and not semantic and not slow"

      - name: Upload Python coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.xml
          flags: python
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Build the sdist and install it in a fresh venv. The binding crate depends on
  # the core crate via a path dep (../argus-redact-core); wheel-only CI would not
  # catch a path-dependency that fails to vendor into the sdist. This job compiles
  # the Rust from source on install, then smoke-tests redact().
  sdist-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05-03

      - name: Build sdist
        run: pip install maturin && maturin sdist --out dist

      - name: Validate sdist metadata (twine check)
        # Catches PyPI-upload-blocking metadata issues that `pip install` does not,
        # e.g. a declared `License-File` missing from the distribution (v0.7.0 hit
        # this — the LICENSE file wasn't bundled, PyPI 400'd on upload).
        run: pip install twine && twine check dist/*

      - name: Install from sdist (fresh venv) + smoke test
        shell: bash
        run: |
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install dist/*.tar.gz
          /tmp/sdist-venv/bin/python -c "from argus_redact import redact; out, key = redact('Alice 13800138000', mode='fast', lang='zh'); assert '13800138000' not in out, out; print('sdist OK')"

  # Build the wasm package (argus-redact-wasm), run its node test suite (smoke +
  # golden-parity), size-optimize the artifact with wasm-opt, and gate the
  # optimized gzipped .wasm against tests/benchmark/wasm_bundle_budget.json.
  # ARTIFACT ONLY — this job does NOT publish to npm. The crate sets
  # `wasm-opt = false` (so wasm-pack does not auto-fetch binaryen), so wasm-opt is
  # run here explicitly. A separate job so a wasm failure is attributed cleanly.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Rust (wasm target)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05-03
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: rust-wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install wasm-pack
        # Idempotent: the Rust cache (keyed on Cargo.lock) restores ~/.cargo/bin,
        # so a cache hit already has wasm-pack and `cargo install` would abort with
        # "binary already exists". Skip the install when it's already on PATH.
        run: command -v wasm-pack >/dev/null || cargo install wasm-pack --locked

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Build wasm package (bundler target)
        run: wasm-pack build crates/argus-redact-wasm --target bundler --out-dir pkg

      - name: Run wasm node tests (smoke + golden-parity)
        run: wasm-pack test --node crates/argus-redact-wasm

      - name: Size-optimize and gate the bundle
        shell: bash
        run: |
          set -euo pipefail
          WASM=crates/argus-redact-wasm/pkg/argus_redact_wasm_bg.wasm
          # Modern LLVM emits bulk-memory / ref-types ops; enable the feature set so
          # wasm-opt validates the wasm-bindgen output (the crate disables wasm-pack's
          # auto wasm-opt, so we run it here).
          wasm-opt -Oz \
            --enable-bulk-memory \
            --enable-nontrapping-float-to-int \
            --enable-sign-ext \
            --enable-mutable-globals \
            --enable-reference-types \
            --enable-multivalue \
            "$WASM" -o /tmp/argus_opt.wasm
          GZ=$(gzip -c /tmp/argus_opt.wasm | wc -c)
          CEILING=$(python3 -c "import json;print(json.load(open('tests/benchmark/wasm_bundle_budget.json'))['budget']['ceiling_bytes'])")
          echo "optimized gzipped .wasm: ${GZ} bytes (budget ceiling: ${CEILING} bytes)"
          if [ "$GZ" -gt "$CEILING" ]; then
            echo "::error::wasm bundle ${GZ} B exceeds budget ${CEILING} B (see tests/benchmark/wasm_bundle_budget.json)"
            exit 1
          fi
          echo "wasm bundle within budget."

  # Rust coverage for the pure core crate (argus-redact-core), uploaded to Codecov
  # under the `rust` flag. Python (`pytest --cov`) only measures the Python surface;
  # as Layer-1 logic moves into the core (validators, normalize, lang_detect, …),
  # this keeps the load-bearing Rust visible in the coverage metric. The binding
  # crate (argus-redact-py) needs Python linking and is exercised via pytest, so it
  # is intentionally out of scope here — `-p argus-redact-core` covers the pure core.
  rust-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05-03
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2.82.2
        with:
          tool: cargo-llvm-cov

      - name: Generate Rust coverage (codecov format)
        run: cargo llvm-cov -p argus-redact-core --codecov --output-path rust-cov.json

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: rust-cov.json
          flags: rust
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
