version: 2
updates:
  # GitHub Actions: keep SHAs current. We pin every `uses:` to a 40-char commit
  # SHA (defends against upstream tag rewrites); dependabot opens PRs to bump
  # the SHA when the upstream cuts a new release.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  # Python: pyproject.toml's runtime + optional-dependency extras (dev, serve,
  # mcp, presidio, language packs).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns:
          - "*"

  # Rust workspace (Cargo.toml at the root + member crates; lockfile at root).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo:
        patterns:
          - "*"
    ignore:
      # sha3 0.12 moved SHAKE-256 into a separate pre-1.0 crate. The pseudonym
      # KDF stays on 0.11 until that crate is a 1.x we are willing to take.
      # See CHANGELOG v0.8.18.
      - dependency-name: "sha3"
        versions: [">=0.12.0"]

  # Demo browser-test harness (tests/demo/package.json + package-lock.json).
  - package-ecosystem: "npm"
    directory: "/tests/demo"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns:
          - "*"
