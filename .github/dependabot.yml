version: 2
updates:
  # GitHub Actions: keep SHAs current. We pin every `uses:` to a 40-char commit
  # SHA (defends against upstream tag rewrites); dependabot opens PRs to bump
  # the SHA when the upstream cuts a new release.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  # Python: pyproject.toml's runtime + optional-dependency extras (dev, serve,
  # mcp, presidio, language packs).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns:
          - "*"

  # Rust workspace (Cargo.toml at the repo root + member crates' Cargo.lock).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo:
        patterns:
          - "*"

  # Demo browser-test harness (tests/demo/package.json + package-lock.json).
  - package-ecosystem: "npm"
    directory: "/tests/demo"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns:
          - "*"
