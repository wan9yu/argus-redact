<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>argus-redact — 在浏览器里脱敏 / Redact PII in your browser</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header>
    <h1 id="headline"></h1>
    <p id="headline-en" class="subtitle"></p>
    <p id="trust" class="trust"></p>
    <span id="status" class="status-loading"></span>
  </header>

  <main>
    <section id="hero" class="card">
      <textarea id="hero-input" rows="3"></textarea>
      <div class="chips"><span id="hero-try"></span><span id="hero-chips"></span></div>
      <button id="hero-redact" type="button" class="primary" disabled></button>
      <div class="two-up">
        <div><h3 id="lbl-your"></h3><pre id="hero-original"></pre></div>
        <div><h3 id="lbl-ai"></h3><pre id="hero-redacted"></pre></div>
      </div>
      <div id="hero-restore" class="restore"></div>
      <div id="hero-error" class="error"></div>
    </section>

    <section id="how" class="card">
      <h2 id="how-title"></h2>
      <ol id="how-steps"></ol>
      <div id="badges" class="badges"></div>
      <p id="how-limit" class="limit"></p>
    </section>

    <section id="llm-proof" class="card"></section>

    <details id="dev" class="card">
      <summary id="dev-summary"></summary>
      <div id="dev-body"></div>
      <div id="streaming-body"></div>
    </details>
  </main>

  <footer>
    <a href="https://github.com/wan9yu/argus-redact">GitHub</a> ·
    <code>pip install argus-redact</code>
  </footer>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
